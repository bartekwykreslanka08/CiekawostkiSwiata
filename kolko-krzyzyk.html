<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Kółko i krzyżyk PRO</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    min-height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at top, #202936, #080a0d 65%);
    color: white;
    padding: 15px;
}

/* POWRÓT */

.back {
    display: inline-block;
    text-decoration: none;
    color: white;
    background: #191d23;
    border: 1px solid #343a43;
    padding: 11px 16px;
    border-radius: 12px;
    margin-bottom: 15px;
    transition: .2s;
}

.back:hover {
    background: #292f38;
}

/* TYTUŁ */

h1 {
    text-align: center;
    font-size: clamp(30px, 7vw, 55px);
    margin: 5px 0 25px;
}

/* GŁÓWNY PANEL */

.game {
    width: min(850px, 100%);
    margin: auto;
}

.panel {
    background: rgba(13,15,19,.95);
    border: 1px solid #303640;
    border-radius: 25px;
    padding: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
}

/* USTAWIENIA */

.settings {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
}

.setting label {
    display: block;
    color: #8e96a3;
    font-size: 12px;
    margin-bottom: 7px;
}

select {
    width: 100%;
    background: #181c22;
    color: white;
    border: 1px solid #363c46;
    border-radius: 10px;
    padding: 12px;
    font-size: 15px;
}

/* WYNIKI */

.scores {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 18px 0;
}

.score {
    background: #101216;
    border: 1px solid #292e36;
    border-radius: 15px;
    padding: 12px;
    text-align: center;
}

.score small {
    color: #8b929d;
}

.score strong {
    display: block;
    font-size: 30px;
    margin-top: 5px;
}

/* STATUS */

.status {
    text-align: center;
    font-size: 19px;
    font-weight: bold;
    min-height: 28px;
    margin: 15px 0;
}

/* PLANSZA */

.board {
    width: min(500px, 92vw);
    aspect-ratio: 1;
    margin: auto;

    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
}

.cell {
    border: 1px solid #353b45;
    border-radius: 18px;

    background:
        linear-gradient(145deg,
        #1c2129,
        #0e1014);

    color: white;

    font-size: clamp(50px, 15vw, 95px);
    font-weight: 900;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    transition: .15s;
}

.cell:hover {
    background: #262c35;
    transform: scale(.97);
}

.cell.win {
    background: #263925;
    border-color: #8cff69;
    box-shadow:
        0 0 30px rgba(140,255,105,.2);
}

.cell.disabled {
    cursor: default;
}

/* PRZYCISKI */

.buttons {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 20px;
}

button.action {
    border: 0;
    border-radius: 12px;
    padding: 13px 20px;
    cursor: pointer;
    font-weight: bold;
    background: white;
    color: black;
}

button.action.secondary {
    background: #282d34;
    color: white;
}

button.action:hover {
    transform: translateY(-2px);
}

/* STATYSTYKI */

.stats {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    margin-top: 20px;
}

.stat {
    background: #101216;
    border: 1px solid #292e36;
    border-radius: 13px;
    padding: 14px;
    color: #9098a5;
}

.stat b {
    display: block;
    color: white;
    font-size: 21px;
    margin-top: 4px;
}

/* TELEFON */

@media(max-width:500px) {

    body {
        padding: 10px;
    }

    .panel {
        padding: 13px;
    }

    .scores strong {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<div class="game">

<a href="index.html" class="back">
    ← Wróć do najdziwniejszej strony
</a>

<h1>⭕❌ Kółko i krzyżyk PRO</h1>

<div class="panel">

<!-- USTAWIENIA -->

<div class="settings">

    <div class="setting">
        <label>POZIOM BOTA</label>

        <select id="difficulty">
            <option value="easy">Łatwy</option>
            <option value="medium">Normalny</option>
            <option value="hard" selected>Trudny</option>
            <option value="impossible">Niemożliwy</option>
        </select>
    </div>


    <div class="setting">
        <label>TWÓJ SYMBOL</label>

        <select id="symbol">
            <option value="X">❌ X</option>
            <option value="O">⭕ O</option>
        </select>
    </div>


    <div class="setting">
        <label>KTO ZACZYNA?</label>

        <select id="starter">
            <option value="player">Ty</option>
            <option value="bot">Bot</option>
            <option value="random">Losowo</option>
        </select>
    </div>

</div>


<!-- WYNIKI -->

<div class="scores">

    <div class="score">
        <small>TY</small>
        <strong id="playerScore">0</strong>
    </div>

    <div class="score">
        <small>REMISY</small>
        <strong id="drawScore">0</strong>
    </div>

    <div class="score">
        <small>BOT</small>
        <strong id="botScore">0</strong>
    </div>

</div>


<!-- STATUS -->

<div id="status" class="status">
    Twój ruch.
</div>


<!-- PLANSZA -->

<div class="board">

    <button class="cell" data-i="0"></button>
    <button class="cell" data-i="1"></button>
    <button class="cell" data-i="2"></button>

    <button class="cell" data-i="3"></button>
    <button class="cell" data-i="4"></button>
    <button class="cell" data-i="5"></button>

    <button class="cell" data-i="6"></button>
    <button class="cell" data-i="7"></button>
    <button class="cell" data-i="8"></button>

</div>


<!-- PRZYCISKI -->

<div class="buttons">

    <button class="action" onclick="newRound()">
        🔄 NOWA RUNDA
    </button>

    <button
        class="action secondary"
        onclick="resetScores()">

        🗑️ RESET WYNIKÓW

    </button>

</div>


<!-- STATYSTYKI -->

<div class="stats">

    <div class="stat">
        RUCHY
        <b id="moves">0</b>
    </div>

    <div class="stat">
        TWOJA SERIA
        <b id="streak">0</b>
    </div>

    <div class="stat">
        NAJLEPSZA SERIA
        <b id="best">0</b>
    </div>

</div>

</div>
</div>


<script>

/* ================================
   ZMIENNE
================================ */

const cells =
    document.querySelectorAll(".cell");

const statusText =
    document.getElementById("status");

let board;

let player;
let bot;

let turn;

let gameOver;

let moves = 0;

let playerScore = 0;
let botScore = 0;
let drawScore = 0;

let streak = 0;

let best =
    Number(localStorage.getItem(
        "tic_best_streak"
    )) || 0;


/* WYGRANE */

const wins = [

    [0,1,2],
    [3,4,5],
    [6,7,8],

    [0,3,6],
    [1,4,7],
    [2,5,8],

    [0,4,8],
    [2,4,6]

];


/* ================================
   KLIKNIĘCIE
================================ */

cells.forEach(cell => {

    cell.addEventListener("click", () => {

        const i =
            Number(cell.dataset.i);

        if (
            gameOver ||
            turn !== "player" ||
            board[i]
        ) {
            return;
        }

        move(i, player);

        if (!gameOver) {

            turn = "bot";

            setStatus("🤖 Bot myśli...");

            setTimeout(botMove, 400);

        }

    });

});


/* ================================
   RUCH
================================ */

function move(i, symbol) {

    board[i] = symbol;

    moves++;

    render();

    const result =
        winner(board);

    if (result) {

        endGame(result);

    }

}


/* ================================
   RYSOWANIE
================================ */

function render() {

    cells.forEach((cell, i) => {

        cell.textContent =
            board[i];

        cell.classList.toggle(
            "disabled",
            board[i] !== ""
        );

    });

    document.getElementById(
        "moves"
    ).textContent = moves;

}


/* ================================
   SPRAWDZANIE
================================ */

function winner(state) {

    for (const line of wins) {

        const [a,b,c] = line;

        if (
            state[a] &&
            state[a] === state[b] &&
            state[a] === state[c]
        ) {

            return {
                winner: state[a],
                line
            };

        }

    }

    if (!state.includes("")) {

        return {
            winner: "draw",
            line: []
        };

    }

    return null;

}


/* ================================
   KONIEC GRY
================================ */

function endGame(result) {

    gameOver = true;

    result.line.forEach(i => {

        cells[i].classList.add("win");

    });


    if (result.winner === player) {

        playerScore++;

        streak++;

        if (streak > best) {

            best = streak;

            localStorage.setItem(
                "tic_best_streak",
                best
            );

        }

        setStatus("🏆 WYGRYWASZ!");

    }

    else if (result.winner === bot) {

        botScore++;

        streak = 0;

        setStatus("🤖 BOT WYGRYWA!");

    }

    else {

        drawScore++;

        setStatus("🤝 REMIS!");

    }

    updateScores();

}


/* ================================
   BOT
================================ */

function botMove() {

    if (gameOver) return;

    const difficulty =
        document.getElementById(
            "difficulty"
        ).value;

    let selected;


    if (difficulty === "easy") {

        selected = randomMove();

    }

    else if (difficulty === "medium") {

        selected =
            Math.random() < .65
            ? smartMove()
            : randomMove();

    }

    else if (difficulty === "hard") {

        selected =
            Math.random() < .9
            ? smartMove()
            : randomMove();

    }

    else {

        selected =
            minimax(board, bot).index;

    }


    if (selected !== undefined) {

        move(selected, bot);

    }


    if (!gameOver) {

        turn = "player";

        setStatus("👉 Twój ruch.");

    }

}


/* ================================
   LOSOWY
================================ */

function randomMove() {

    const free = [];

    board.forEach((v,i) => {

        if (!v) {
            free.push(i);
        }

    });

    if (!free.length)
        return undefined;

    return free[
        Math.floor(
            Math.random() * free.length
        )
    ];

}


/* ================================
   SMART
================================ */

function smartMove() {

    /* WYGRANA */

    for (let i = 0; i < 9; i++) {

        if (!board[i]) {

            board[i] = bot;

            if (
                winner(board)?.winner === bot
            ) {

                board[i] = "";

                return i;

            }

            board[i] = "";

        }

    }


    /* BLOKADA */

    for (let i = 0; i < 9; i++) {

        if (!board[i]) {

            board[i] = player;

            if (
                winner(board)?.winner === player
            ) {

                board[i] = "";

                return i;

            }

            board[i] = "";

        }

    }


    /* ŚRODEK */

    if (!board[4])
        return 4;


    /* ROGI */

    const corners =
        [0,2,6,8]
        .filter(i => !board[i]);

    if (corners.length) {

        return corners[
            Math.floor(
                Math.random() *
                corners.length
            )
        ];

    }


    return randomMove();

}


/* ================================
   MINIMAX
================================ */

function minimax(state, symbol) {

    const result =
        winner(state);

    if (result) {

        if (result.winner === bot)
            return { score: 10 };

        if (result.winner === player)
            return { score: -10 };

        return { score: 0 };

    }


    const possible = [];


    for (let i = 0; i < 9; i++) {

        if (!state[i]) {

            const test = {
                index: i
            };

            state[i] = symbol;


            const result =
                minimax(
                    state,
                    symbol === bot
                    ? player
                    : bot
                );


            test.score =
                result.score;

            state[i] = "";

            possible.push(test);

        }

    }


    let bestMove;


    if (symbol === bot) {

        let bestScore = -Infinity;

        possible.forEach(m => {

            if (m.score > bestScore) {

                bestScore = m.score;

                bestMove = m;

            }

        });

    }

    else {

        let bestScore = Infinity;

        possible.forEach(m => {

            if (m.score < bestScore) {

                bestScore = m.score;

                bestMove = m;

            }

        });

    }


    return bestMove;

}


/* ================================
   NOWA RUNDA
================================ */

function newRound() {

    board =
        ["","","","","","","","",""];

    gameOver = false;

    moves = 0;

    cells.forEach(cell => {

        cell.classList.remove("win");

    });


    player =
        document.getElementById(
            "symbol"
        ).value;

    bot =
        player === "X"
        ? "O"
        : "X";


    const starter =
        document.getElementById(
            "starter"
        ).value;


    if (starter === "random") {

        turn =
            Math.random() < .5
            ? "player"
            : "bot";

    }

    else {

        turn = starter;

    }


    render();


    if (turn === "player") {

        setStatus("👉 Twój ruch.");

    }

    else {

        setStatus("🤖 Bot zaczyna...");

        setTimeout(botMove, 500);

    }

}


/* ================================
   RESET WYNIKÓW
================================ */

function resetScores() {

    playerScore = 0;
    botScore = 0;
    drawScore = 0;

    streak = 0;

    updateScores();

    newRound();

}


/* ================================
   WYNIKI
================================ */

function updateScores() {

    document.getElementById(
        "playerScore"
    ).textContent = playerScore;

    document.getElementById(
        "botScore"
    ).textContent = botScore;

    document.getElementById(
        "drawScore"
    ).textContent = drawScore;

    document.getElementById(
        "streak"
    ).textContent = streak;

    document.getElementById(
        "best"
    ).textContent = best;

}


/* ================================
   STATUS
================================ */

function setStatus(text) {

    statusText.textContent = text;

}


/* START
================================ */

updateScores();

newRound();

</script>

</body>
</html>
